name: Add or improve a door
description: Propose a new decoy door (path and contents), or make an existing one more convincing
title: "[door] "
body:
  - type: markdown
    attributes:
      value: |
        Door contents must stay inside [the lines sanadamaru never crosses](https://github.com/mamorune-com/sanadamaru/blob/main/docs/en/lines.md): plain text only, entirely fake, no other company's key formats, and the same content on every read.

        日本語での投稿も歓迎します。
  - type: input
    id: path
    attributes:
      label: Path
      description: "For example: /.env.staging"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence that scanners actually probe this path
      description: A public report, or hit counts from your own server logs. Please remove source addresses.
    validations:
      required: true
  - type: textarea
    id: collision
    attributes:
      label: Could it collide with a real endpoint?
      description: Does any ordinary web app or framework serve a real endpoint at this path?
    validations:
      required: true
