name: Stage 2 (tarpit) idea
description: A design proposal for the tarpit that leads only visitors who touched a door into a maze
title: "[stage 2] "
body:
  - type: markdown
    attributes:
      value: |
        Please read the conditions and open questions in [docs/en/stage2.md](https://github.com/mamorune-com/sanadamaru/blob/main/docs/en/stage2.md) first. Code pull requests are welcome once the design is settled. Do not post techniques that target real services.

        日本語での投稿も歓迎します。
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: How it meets conditions 1 to 6
      description: In particular, "run nothing on the visitor's machine" and "clear limits on the defender's cost".
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How to measure whether it works
