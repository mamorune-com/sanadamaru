[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sanadamaru"
version = "0.2.1"
description = "Tiny dependency-free honeypot for Python web apps (ASGI/WSGI): decoy paths and marked fake keys reveal who is probing. No hack-back."
readme = "README.md"
# ライセンスの写し（LICENSE・NOTICE）は、リポジトリのいちばん上のものを python/ に写して部品に入れる（CI が食い違いを落とす）
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["honeypot", "security", "asgi", "wsgi", "fastapi", "flask", "deception"]
classifiers = [
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]

[project.urls]
Homepage = "https://github.com/mamorune-com/sanadamaru"
Security = "https://github.com/mamorune-com/sanadamaru/security/policy"

[tool.setuptools]
packages = ["sanadamaru"]
